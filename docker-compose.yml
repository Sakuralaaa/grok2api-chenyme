name: grok2api

services:
  grok2api:
    container_name: grok2api
    image: "${GROK2API_IMAGE:-ghcr.io/chenyme/grok2api:latest}"
    ports:
      - "${GROK2API_PORT:-8000}:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 非空时覆盖 config.yaml 的 PostgreSQL DSN，并自动启用 postgres。
      GROK2API_DATABASE_URL: "${GROK2API_DATABASE_URL:-}"
      GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
      GROK2API_ACCOUNT_REGISTRAR_DIR: /var/lib/grok2api-account-registrar
    volumes:
      - "${GROK2API_CONFIG:-./config.yaml}:/run/grok2api/config.yaml:ro"
      - grok2api-data:/app/data
      - quality_guard_state:/var/lib/grok2api-quality-guard
      - registrar_state:/var/lib/grok2api-account-registrar
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # ================================ WARP ================================
  # 如果出口 IP 不干净，可取消以下注释使用 WARP 作为落地代理。
  # 启用后，在管理端“设置 -> 出口代理”中新增 socks5://warp:1080。

  # warp:
  #   container_name: warp
  #   image: caomingjun/warp:latest
  #   profiles: ["warp"]
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:1080:1080"
  #   environment:
  #     - WARP_SLEEP=2
  #   cap_add:
  #     - NET_ADMIN

  # ================================ FLARESOLVERR ================================
  # 在管理端将 Clearance 模式设为 FlareSolverr 或按需刷新，并使用 http://flaresolverr:8191。
  # 启动命令：docker compose --profile flaresolverr up -d
  # Podman：podman compose --profile flaresolverr up -d

  # flaresolverr:
  #   container_name: flaresolverr
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   profiles: ["flaresolverr"]
  #   environment:
  #     TZ: Asia/Shanghai
  #     LOG_LEVEL: info
  #   restart: unless-stopped

  # ================================ EGRESS QUALITY GUARD ================================
  # 可选的 Grok Build 出口质量守护 sidecar。默认不启动，也不会产生探测请求。
  # 启用前在 config.yaml 中配置 qualityGuard，然后执行：
  # docker compose --profile quality-guard up -d --build

  egress-quality-guard:
    container_name: grok2api-egress-quality-guard
    profiles: ["quality-guard"]
    build:
      context: .
      dockerfile: tools/egress-quality-guard/Dockerfile
    environment:
      # Default matches the Compose service name. Override for host networking
      # or a renamed grok2api service, e.g. http://127.0.0.1:8000
      GROK2API_BASE_URL: ${GROK2API_BASE_URL:-http://grok2api:8000}
    depends_on:
      grok2api:
        condition: service_healthy
    volumes:
      - quality_guard_state:/var/lib/grok2api-quality-guard
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true


  # ================================ ACCOUNT REGISTRAR ================================
  # 注册机 sidecar（可选）。带 Camoufox/Firefox + Xvfb，镜像 1.2~1.5 GB，
  # 由 .github/workflows/account-registrar-image.yml 构建并发布到 GHCR。
  # 一次性试跑：docker compose --profile registrar run --rm account-registrar --once

  account-registrar:
    container_name: grok2api-account-registrar
    profiles: ["registrar"]
    image: "${REGISTRAR_IMAGE:-ghcr.io/sakuralaaa/grok2api-chenyme/account-registrar:latest}"
    environment:
      REGISTRAR_COUNT: "${REGISTRAR_COUNT:-1}"
      REGISTRAR_DOMAINS: "${REGISTRAR_DOMAINS:-}"
      REGISTRAR_APP_DIR: /opt/registrar-app
      REGISTRAR_OUT_DIR: /out
      CAMOUFOX_GEOIP_IP: "${CAMOUFOX_GEOIP_IP:-}"
      # 带认证 socks5 必须走本地转发，填上游 URL 即可（入口会自动指向转发口）
      RELAY_UPSTREAM: "${RELAY_UPSTREAM:-}"
      REGISTRAR_PROXY: "${REGISTRAR_PROXY:-}"
      # 邮件服务凭据（镜像内不存任何密钥）
      REGISTRAR_EMAIL_PROVIDER: "${REGISTRAR_EMAIL_PROVIDER:-cloudflare}"
      REGISTRAR_CLOUDFLARE_API_BASE: "${REGISTRAR_CLOUDFLARE_API_BASE:-}"
      REGISTRAR_CLOUDFLARE_API_KEY: "${REGISTRAR_CLOUDFLARE_API_KEY:-}"
      REGISTRAR_CLOUDFLARE_AUTH_MODE: "${REGISTRAR_CLOUDFLARE_AUTH_MODE:-x-admin-auth}"
      # 可选：显式内部令牌。留空则读共享卷里的 bootstrap.json（compose 默认）。
      REGISTRAR_INTERNAL_TOKEN: "${REGISTRAR_TOKEN:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      # 本机可用宿主机目录覆盖镜像内置注册机；留空则不覆盖，直接用镜像内源码
      - "${REGISTRAR_APP_PATH:-./registrar-app}:/opt/registrar-app"
      - registrar_out:/out
      # 与主程序共享：主程序写入 bootstrap.json（含内部令牌），sidecar 读取
      - registrar_state:/var/lib/grok2api-account-registrar
    depends_on:
      grok2api:
        condition: service_healthy
    shm_size: "1gb"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  grok2api-data:
  quality_guard_state:
  registrar_out:
  registrar_state:
